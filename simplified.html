<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snapback</title>
<style>
  html, body { margin: 0; height: 100%; background: black; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="game" width="480" height="270"></canvas>
<script>
const canvas = document.getElementById('game')
const ctx = canvas.getContext('2d')
const width = 480
const height = 270
const trampLeft = 115
const trampRight = 365
const trampY = 205
const poleLeft = 65
const poleRight = 415
const poleTop = 125
const poleBottom = 225
const gravity = 0.26
const guy = [
  '..kkkk..',
  '.kcccck.',
  'kcccccck',
  'kssssssk',
  'ksessesk',
  'kssssssk',
  '.kkkkkk.',
  '.kcccck.',
  'sccccccs',
  '.kcccck.',
  '.kk..kk.',
  'kkk..kkk',
]
let screen = 'title'
let p1, p2
let score1 = 0
let score2 = 0
let time = 0
let waitTime = 0
let keys = {}
function makePlayer(x, color, name, left, right, jump, down) {
  return {
    x: x, y: 150, oldY: 150, xspeed: 0, yspeed: -2,
    level: 1, canSnap: true, hurt: 0, squish: 0, pressedAt: -99, diving: false,
    color: color, name: name, left: left, right: right, jump: jump, down: down
  }
}
function newRound() {
  p1 = makePlayer(190, '#b13e53', 'RED', 'KeyA', 'KeyD', 'KeyW', 'KeyS')
  p2 = makePlayer(290, '#38b764', 'GREEN', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown')
  waitTime = 0
}
function newGame() {
  score1 = 0
  score2 = 0
  time = 0
  newRound()
  screen = 'play'
}
function clamp(n, min, max) {
  return Math.max(min, Math.min(max, n))
}
function move(p) {
  let dir = 0
  if (keys[p.right]) dir++
  if (keys[p.left]) dir--
  if (p.hurt > 0) p.hurt--
  if (p.squish > 0) p.squish--
  if (Math.abs(p.xspeed) > 3.2) p.xspeed *= 0.98
  else if (dir) p.xspeed = clamp(p.xspeed + dir * 0.35, -3.2, 3.2)
  else p.xspeed *= 0.85
  p.diving = keys[p.down] && p.yspeed > 0
  p.yspeed += gravity
  if (p.diving) p.yspeed += 0.3
  if (p.yspeed > 9) p.yspeed = 9
  p.oldY = p.y
  p.x += p.xspeed
  p.y += p.yspeed
  if (p.y < 34) {
    p.y = 34
    p.yspeed = 0
  }
  let overTramp = p.x + 6 > trampLeft && p.x - 6 < trampRight
  if (overTramp && p.yspeed > 0 && p.oldY <= trampY && p.y >= trampY) {
    if (time - p.pressedAt < 10) p.level++
    else p.level--
    p.level = clamp(p.level, 1, 4)
    p.y = trampY
    p.yspeed = -(4.5 + p.level * 0.9)
    p.squish = 5
    p.pressedAt = -99
  }
  let leftPole = p.x - 8 < poleLeft && p.x > poleLeft - 20
  let rightPole = p.x + 8 > poleRight && p.x < poleRight + 20
  let poleHeight = p.y > poleTop && p.y - 24 < poleBottom
  if (p.canSnap && (leftPole || rightPole) && poleHeight && time - p.pressedAt < 10) {
    p.xspeed = leftPole ? 5 : -5
    p.yspeed = -6.5
    p.canSnap = false
    p.pressedAt = -99
  }
}
function collide(a, b) {
  if (Math.abs(a.x - b.x) >= 16 || Math.abs(a.y - b.y) >= 24) return
  let top = a.y < b.y ? a : b
  let under = top == a ? b : a
  if (top.oldY <= under.oldY - 20 && top.yspeed > under.yspeed + 1 && under.hurt == 0) {
    under.xspeed = under.x < top.x ? -4.5 : 4.5
    under.yspeed = 1.5
    under.hurt = 25
    under.level = 1
    top.y = under.y - 24
    top.yspeed = -6.2
  } else {
    let side = a.x < b.x ? -1 : 1
    let middle = (a.x + b.x) / 2
    let speed = (a.xspeed + b.xspeed) / 2
    a.x = middle + side * 8
    b.x = middle - side * 8
    a.xspeed = speed + side * 0.9
    b.xspeed = speed - side * 0.9
  }
}
function update() {
  if (screen != 'play') return
  time++
  if (waitTime > 0) {
    waitTime--
    if (waitTime == 0) newRound()
    return
  }
  move(p1)
  move(p2)
  collide(p1, p2)
  let p1Out = p1.y > height + 30
  let p2Out = p2.y > height + 30
  if (p1Out || p2Out) {
    if (p1Out && !p2Out) score2++
    if (p2Out && !p1Out) score1++
    if (score1 >= 3 || score2 >= 3) screen = 'over'
    else waitTime = 30
  }
}
function drawGuy(p) {
  ctx.save()
  ctx.translate(Math.round(p.x), Math.round(p.y))
  if (p.squish > 0) ctx.scale(2.5, 1.5)
  else ctx.scale(2, 2)

  let paint = { k: '#333c57', s: '#ffcd75', c: p.color, e: p.hurt ? '#f4f4f4' : '#1a1c2c' }
  for (let row = 0; row < guy.length; row++) {
    for (let col = 0; col < 8; col++) {
      let pixel = guy[row][col]
      if (pixel == '.') continue
      ctx.fillStyle = paint[pixel]
      ctx.fillRect(col - 4, row - 12, 1, 1)
    }
  }
  ctx.restore()

  if (p.canSnap) {
    ctx.fillStyle = '#ffcd75'
    ctx.fillRect(Math.round(p.x) - 1, Math.round(p.y) - 30, 2, 2)
  }
}
function drawStage() {
  ctx.fillStyle = '#566c86'
  ctx.fillRect(poleLeft - 2, poleTop, 4, poleBottom - poleTop)
  ctx.fillRect(poleRight - 2, poleTop, 4, poleBottom - poleTop)
  ctx.fillStyle = '#333c57'
  ctx.fillRect(trampLeft, trampY, 4, 30)
  ctx.fillRect(trampRight - 4, trampY, 4, 30)
  ctx.fillStyle = '#f4f4f4'
  ctx.fillRect(trampLeft, trampY - 1, trampRight - trampLeft, 2)
}
function write(words, x, y, size, color) {
  ctx.fillStyle = color || '#f4f4f4'
  ctx.font = 'bold ' + size + 'px monospace'
  ctx.textAlign = 'center'
  ctx.fillText(words, x, y)
}
function draw() {
  ctx.fillStyle = 'black'
  ctx.fillRect(0, 0, width, height)
  if (screen == 'title') {
    newRound()
    p1.y = trampY
    p2.y = trampY
    drawStage()
    drawGuy(p1)
    drawGuy(p2)
    write('SNAPBACK', width / 2, 70, 40, '#ffcd75')
    write('red: A D move, W bounce, S dive', width / 2, 105, 10, p1.color)
    write('green: arrow keys', width / 2, 120, 10, p2.color)
    if (Math.floor(Date.now() / 500) % 2) write('press space', width / 2, 160, 14)
    return
  }
  drawStage()
  drawGuy(p1)
  drawGuy(p2)
  write(score1, width / 2 - 20, 30, 24, p1.color)
  write('-', width / 2, 30, 24)
  write(score2, width / 2 + 20, 30, 24, p2.color)
  if (screen == 'paused') {
    write('PAUSED', width / 2, 110, 24)
    write('esc to keep going', width / 2, 130, 10)
  }
  if (screen == 'over') {
    let winner = score1 > score2 ? p1 : p2
    write(winner.name + ' WINS', width / 2, 110, 32, winner.color)
    write('space to play again', width / 2, 135, 12)
  }
}
addEventListener('keydown', e => {
  if (e.code == 'Space' || e.code.startsWith('Arrow')) e.preventDefault()
  if (e.repeat) return
  keys[e.code] = true
  if (e.code == 'Escape') {
    if (screen == 'play') screen = 'paused'
    else if (screen == 'paused') screen = 'play'
  }
  if (e.code == 'Space' && (screen == 'title' || screen == 'over')) newGame()
  if (screen == 'play') {
    if (e.code == p1.jump) p1.pressedAt = time
    if (e.code == p2.jump) p2.pressedAt = time
  }
})
addEventListener('keyup', e => {
  keys[e.code] = false
})
addEventListener('blur', () => {
  if (screen == 'play') screen = 'paused'
})
function resize() {
  let scale = Math.min(innerWidth / width, innerHeight / height)
  if (scale >= 1) scale = Math.floor(scale)
  canvas.style.width = width * scale + 'px'
  canvas.style.height = height * scale + 'px'
}
addEventListener('resize', resize)
resize()
let lastTime = performance.now()
let leftover = 0
function loop(now) {
  leftover += Math.min(now - lastTime, 100)
  lastTime = now
  while (leftover >= 1000 / 60) {
    update()
    leftover -= 1000 / 60
  }
  draw()
  requestAnimationFrame(loop)
}
newRound()
requestAnimationFrame(loop)
</script>
</body>
</html>
