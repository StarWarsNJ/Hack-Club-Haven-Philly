<title>Snapback</title>
<style>
* { box-sizing: border-box }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #101417; color: #F2EDE3; font-family: Arial, Helvetica, sans-serif }
body, main { display: grid; place-items: center }
main { width: 100%; height: 100%; position: relative }
canvas { display: block; outline: none; touch-action: none }
#controls { position: absolute; left: 50%; top: 75%; display: flex; gap: 24px; transform: translateX(-50%) }
#controls[hidden] { display: none }
button { border: 0; border-bottom: 1px solid #56645D; color: #F2EDE3; background: transparent; padding: 8px 0; font: 12px Arial, Helvetica, sans-serif; cursor: pointer; white-space: nowrap }
button:focus-visible { outline: 2px solid #E6D5A5; outline-offset: 5px }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%) }
</style>

<body>
<main aria-label="Snapback two-player arcade game">
<canvas id="game" width="960" height="540" tabindex="0" role="img" aria-label="Snapback. Coral uses A and D to move, W to bounce or save, S to dive. Mint uses the arrow keys. Space or Enter starts, Escape pauses, M toggles sound, V reduces motion."></canvas>
<div id="controls" hidden><button id="sound" type="button">M · Sound on</button><button id="motion" type="button">V · Motion full</button></div>
<p id="status" class="sr-only" aria-live="polite">Snapback. Space or Enter to play.</p>
</main>

const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const mix=(a,b,t)=>a+(b-a)*t;
const sign=n=>n<0?-1:n>0?1:0;
const NEVER=-1000000;
const PLAYER_KEYS=[{
  left:'KeyA',
  right:'KeyD',
  bounce:'KeyW',
  dive:'KeyS'
},{
  left:'ArrowLeft',
  right:'ArrowRight',
  bounce:'ArrowUp',
  dive:'ArrowDown'
}];
const GAME_KEYS=new Set(PLAYER_KEYS.flatMap(k=>Object.values(k)).concat(['Space','Enter','Escape','KeyM','KeyV']));
// State uses center x / top y. Every rally replaces its complete transient state.
function createPlayer(id){
  return {
    id,
    x:CONFIG.player.spawnX[id],
    y:CONFIG.player.spawnY,
    vx:0,
    vy:CONFIG.player.spawnVy,
    prevX:CONFIG.player.spawnX[id],
    prevY:CONFIG.player.spawnY,
    tier:CONFIG.bounce.startTier,
    recoveryCharge:1,
    netPressTick:NEVER,
    savePressTick:NEVER,
    netPressReady:0,
    bouncePressed:false,
    compression:null,
    protection:0,
    contact:null,
    bumperLatch:[false,false],
    diving:false,
    diveSoundReady:0,
    lastLandingTick:NEVER,
    lastBounceTick:NEVER,
    lastPerfectTick:NEVER,
    lastHitTick:NEVER,
    lastSaveTick:NEVER,
    lastStompTick:NEVER,
    facing:id===0?1:-1
  };
}
function createNet(){
  return {
    d:Array(CONFIG.trampoline.samples).fill(0),
    v:Array(CONFIG.trampoline.samples).fill(0),
    previous:Array(CONFIG.trampoline.samples).fill(0)
  };
}
function createMatchState(){
  return {
    phase:'TITLE',
    previousPhase:null,
    totalTicks:0,
    rallyTicks:0,
    rallyIndex:0,
    scores:[0,0],
    winner:null,
    pendingPoint:null,
    pointTicks:0,
    players:[createPlayer(0),createPlayer(1)],
    net:createNet(),
    overdriveInset:0,
    events:[],
    effects:[],
    muted:false,
    reducedMotion:false,
    stats:{
      bounces:[0,0],
      perfect:[0,0],
      stomps:[0,0],
      saves:[0,0],
      points:0,
      draws:0
    }
  };
}
function resetRally(s){
  s.players=[createPlayer(0),createPlayer(1)];
  s.net=createNet();
  s.rallyTicks=0;
  s.overdriveInset=0;
  s.pendingPoint=null;
  s.pointTicks=0;
  s.effects=[];
  s.events=[];
  s.rallyIndex++;
  s.phase='RALLY';
  s.previousPhase=null;
}
function startMatch(s){
  s.scores=[0,0];
  s.winner=null;
  s.totalTicks=0;
  s.rallyIndex=0;
  s.stats={
    bounces:[0,0],
    perfect:[0,0],
    stomps:[0,0],
    saves:[0,0],
    points:0,
    draws:0
  };
  resetRally(s);
}
function setPaused(s,pause){
  if(pause&&['RALLY','POINT_FREEZE'].includes(s.phase)){
    s.previousPhase=s.phase;
    s.phase='PAUSED';
  }else if(!pause&&s.phase==='PAUSED'){
    s.phase=s.previousPhase;
    s.previousPhase=null;
  }
  clearPlayerPresses(s);
}
function clearPlayerPresses(s){
  for(const p of s.players){
    p.netPressTick=NEVER;
    p.savePressTick=NEVER;
  }
}
function emit(s,type,data={
}){
  const e=Object.assign({
    type,
    tick:s.totalTicks
  },data);
  s.events.push(e);
  s.effects.push(e);
  if(s.effects.length>CONFIG.presentation.maxEffects)s.effects.shift();
}
function netBounds(s){
  return {
    left:CONFIG.trampoline.left+s.overdriveInset,
    right:CONFIG.trampoline.right-s.overdriveInset
  };
}
function sampleNetAt(s,x,previous=false){
  const b=netBounds(s),
  u=clamp((x-b.left)/(b.right-b.left),0,1)*(CONFIG.trampoline.samples-1),
  i=Math.min(Math.floor(u),CONFIG.trampoline.samples-2),
  t=u-i,
  a=previous?s.net.previous:s.net.d;
  return {
    y:CONFIG.trampoline.equilibriumY+mix(a[i],a[i+1],t),
    vy:mix(s.net.v[i],s.net.v[i+1],t),
    i,
    t
  };
}
// One shared, bounded spring mesh. Contacts read one snapshot before adding forces.
function stepNet(s){
  const n=s.net,
  c=CONFIG.trampoline;
  n.previous=n.d.slice();
  const velocities=n.v.map((v,i)=>i===0||i===c.samples-1?0:clamp((v-c.spring*n.d[i]+c.neighborCoupling*(n.d[i-1]+n.d[i+1]-2*n.d[i]))*c.damping,-c.maxVelocity,c.maxVelocity));
  for(let i=0;i<c.samples;i++){
    n.v[i]=velocities[i];
    const raw=n.d[i]+n.v[i];
    n.d[i]=clamp(raw,-c.maxDeflection,c.maxDeflection);
    if(raw!==n.d[i])n.v[i]=0;
  }
}
function impactNet(s,x,strength){
  const sample=sampleNetAt(s,x);
  for(const [i,w] of [[sample.i,1-sample.t],[sample.i+1,sample.t]])if(i>0&&i<CONFIG.trampoline.samples-1)s.net.v[i]=clamp(s.net.v[i]+strength*w,-CONFIG.trampoline.maxVelocity,CONFIG.trampoline.maxVelocity);
}
function acceptPresses(s,pressed){
  for(const p of s.players){
    if(!pressed.has(PLAYER_KEYS[p.id].bounce))continue;
    p.savePressTick=s.rallyTicks;
    if(!p.compression&&!p.bouncePressed&&s.rallyTicks>=p.netPressReady){
      p.bouncePressed=true;
      p.netPressTick=s.rallyTicks;
      p.netPressReady=s.rallyTicks+CONFIG.bounce.pressCooldownTicks;
    }
  }
}
function steerAndMove(p,held){
  const c=CONFIG.player
  const k=PLAYER_KEYS[p.id]
  const dir=Number(!!held[k.right])-Number(!!held[k.left])
  p.prevX=p.x
  p.prevY=p.y
  p.diving=!p.compression&&!!held[k.dive]&&p.vy>=0
  if(p.protection>0)p.protection--
  if(Math.abs(p.vx)>c.maxVx){
    p.vx*=c.knockDrag
    if(dir&&sign(dir)!==sign(p.vx))p.vx+=dir*c.airAccel*c.escapeControl
  }else if(dir){
    const acceleration=p.vx*dir<0?c.turnAccel:c.airAccel
    p.vx=clamp(p.vx+dir*acceleration,-c.maxVx,c.maxVx)
  }else p.vx*=c.noInputDrag
  if(dir)p.facing=dir
  p.x+=p.vx
  if(p.compression)return
  p.vy=Math.min(c.maxFallVy,p.vy+c.gravity+(p.diving?c.diveGravityBonus:0))
  p.y+=p.vy
  if(p.y<c.ceilingY){
    p.y=c.ceilingY
    p.vy=Math.max(0,p.vy)
  }
}

function axisSweep(aMin,aMax,bMin,bMax,delta){
  if(delta===0)return aMax>bMin&&aMin<bMax?[-Infinity,Infinity]:[Infinity,-Infinity];
  return delta>0?[(bMin-aMax)/delta,(bMax-aMin)/delta]:[(bMax-aMin)/delta,(bMin-aMax)/delta];
}
// Swept relative AABB contact; positive overlap at contact is required for a stomp.
function bodyContact(a,b){
  const w=CONFIG.player.width,
  h=CONFIG.player.height,
  dx=(a.x-a.prevX)-(b.x-b.prevX),
  dy=(a.y-a.prevY)-(b.y-b.prevY),
  xs=axisSweep(a.prevX-w/2,a.prevX+w/2,b.prevX-w/2,b.prevX+w/2,dx),
  ys=axisSweep(a.prevY,a.prevY+h,b.prevY,b.prevY+h,dy),
  entry=Math.max(xs[0],ys[0]),
  exit=Math.min(xs[1],ys[1]),
  initialOverlap=Math.abs(a.prevX-b.prevX)<w&&Math.abs(a.prevY-b.prevY)<h;
  if(entry>exit||exit<0||entry>1||(!initialOverlap&&entry<0))return null;
  return {
    t:clamp(entry,0,1),
    vertical:ys[0]>=xs[0],
    initialOverlap
  };
}
function performStomp(s,a,d,t){
  const ax=mix(a.prevX,a.x,t),
  dx=mix(d.prevX,d.x,t),
  dy=mix(d.prevY,d.y,t),
  direction=Math.abs(dx-ax)>CONFIG.collision.epsilon?sign(dx-ax):(sign(a.vx)||(d.id===0?-1:1)),
  relative=a.vy-d.vy,
  knock=clamp(CONFIG.stomp.horizontalBaseKnock+relative*CONFIG.stomp.horizontalSpeedScale,CONFIG.stomp.horizontalBaseKnock,CONFIG.stomp.horizontalKnockMax);
  a.x=ax;
  d.x=dx;
  d.y=dy;
  a.y=dy-CONFIG.player.height-CONFIG.collision.epsilon;
  d.vx=direction*knock;
  d.vy=Math.max(d.vy,CONFIG.stomp.defenderDownVy);
  d.tier=CONFIG.bounce.minTier;
  d.protection=CONFIG.stomp.protectionTicks;
  d.compression=null;
  a.compression=null;
  d.lastHitTick=s.rallyTicks;
  a.vy=-CONFIG.stomp.attackerBounceImpulse;
  a.lastStompTick=s.rallyTicks;
  a.bouncePressed=false;
  a.netPressTick=NEVER;
  d.lastStompTick=s.rallyTicks;
  s.stats.stomps[a.id]++;
  emit(s,'STOMP',{
    id:a.id,
    x:dx,
    y:dy,
    direction
  });
}
function resolvePlayerContact(s){
  const [a,b]=s.players,
  c=bodyContact(a,b);
  if(!c)return false;
  const h=CONFIG.player.height,
  tol=CONFIG.collision.topTolerance,
  overlap=CONFIG.player.width-Math.abs(mix(a.prevX,a.x,c.t)-mix(b.prevX,b.x,c.t)),
  fromAbove=(p,q)=>overlap>CONFIG.collision.epsilon&&p.prevY+h<=q.prevY+tol&&p.vy>0&&p.vy-q.vy>CONFIG.stomp.minRelativeFallSpeed&&q.protection===0,
  aTop=c.vertical&&fromAbove(a,b),
  bTop=c.vertical&&fromAbove(b,a);
  if(aTop!==bTop){
    performStomp(s,aTop?a:b,aTop?b:a,c.t);
    return true;
  }
  const ay=mix(a.prevY,a.y,c.t),
  by=mix(b.prevY,b.y,c.t);
  if(c.vertical&&Math.abs(ay-by)>h/2){
    const upper=ay<by?a:b,
    lower=upper===a?b:a,
    mean=(upper.vy+lower.vy)/2,
    separation=Math.min(CONFIG.collision.neutralRebound,Math.max(0,upper.vy-lower.vy)/2);
    upper.x=mix(upper.prevX,upper.x,c.t);
    lower.x=mix(lower.prevX,lower.x,c.t);
    lower.y=mix(lower.prevY,lower.y,c.t);
    upper.y=lower.y-h-CONFIG.collision.epsilon;
    upper.vy=mean-separation;
    lower.vy=mean+separation;
    return false;
  }
  const ax=mix(a.prevX,a.x,c.t),
  bx=mix(b.prevX,b.x,c.t),
  direction=sign(bx-ax)||1,
  mid=(ax+bx)/2,
  mean=(a.vx+b.vx)/2;
  a.x=mid-direction*(CONFIG.player.width+CONFIG.collision.epsilon)/2;
  b.x=mid+direction*(CONFIG.player.width+CONFIG.collision.epsilon)/2;
  a.y=ay;
  b.y=by;
  a.vx=mean-direction*CONFIG.collision.sideImpulse;
  b.vx=mean+direction*CONFIG.collision.sideImpulse;
  return false;
}
function saveEligible(s,p){
  return p.recoveryCharge>0&&p.contact&&s.rallyTicks-p.contact.tick<=CONFIG.bumper.postContactGraceTicks&&p.savePressTick>=p.contact.tick-CONFIG.bumper.preContactTicks&&p.savePressTick<=p.contact.tick+CONFIG.bumper.postContactGraceTicks;
}
function performSave(s,p){
  const direction=p.contact.side===0?1:-1;
  p.recoveryCharge=0;
  p.vx=direction*CONFIG.bumper.inwardLaunchVx;
  p.vy=-CONFIG.bumper.upwardLaunchVy;
  p.lastSaveTick=s.rallyTicks;
  p.bouncePressed=false;
  p.compression=null;
  p.netPressTick=NEVER;
  p.savePressTick=NEVER;
  p.contact=null;
  s.stats.saves[p.id]++;
  emit(s,'SNAPBACK',{
    id:p.id,
    x:p.x,
    y:p.y,
    direction
  });
}
// First physical touch anchors grace. A save never relies on net anti-mash cooldown.
function resolveBumperSave(s,p){
  const c=CONFIG.bumper,
  w=CONFIG.player.width,
  h=CONFIG.player.height;
  for(let side=0;side<2;side++){
    const plane=side===0?c.leftX:c.rightX,
    outward=side===0?p.x-w/2<=plane&&p.prevX-w/2>=plane:p.x+w/2>=plane&&p.prevX+w/2<=plane;
    if(Math.abs(p.x-plane)>c.rearmDistance)p.bumperLatch[side]=false;
    if(!outward||p.bumperLatch[side])continue;
    const before=p.prevX+(side===0?-w/2:w/2),
    after=p.x+(side===0?-w/2:w/2),
    t=clamp((plane-before)/(after-before||1),0,1),
    y=mix(p.prevY,p.y,t);
    if(y+h<c.topY||y>c.bottomY)continue;
    p.x=plane+(side===0?w/2:-w/2);
    p.contact={
      side,
      tick:s.rallyTicks
    };
    p.bumperLatch[side]=true;
    p.vx=(side===0?1:-1)*c.softReboundVx;
    emit(s,'BUMPER',{
      id:p.id,
      x:plane,
      y:y+h/2
    });
  }
  if(saveEligible(s,p)){
    performSave(s,p);
    return true;
  }
  if(p.contact&&s.rallyTicks-p.contact.tick>c.postContactGraceTicks)p.contact=null;
  return false;
}
function findNetLanding(s,p){
  if(p.compression||p.vy<=0)return null;
  const b=netBounds(s),
  h=CONFIG.player.height,
  w=CONFIG.player.width,
  eps=CONFIG.collision.epsilon,
  sampleAt=t=>{
    const x=mix(p.prevX,p.x,t),
    old=sampleNetAt(s,x,true),
    now=sampleNetAt(s,x);
    return {
      x,
      y:mix(old.y,now.y,t),
      vy:now.vy
    };
  };
  if(p.prevY+h>sampleAt(0).y+eps)return null;
  let prior=0;
  for(let i=1;i<=CONFIG.collision.sweepSamples;i++){
    const t=i/CONFIG.collision.sweepSamples,
    net=sampleAt(t);
    if(mix(p.prevY,p.y,t)+h>=net.y){
      let lo=prior,
      hi=t;
      for(let j=0;j<CONFIG.collision.rootIterations;j++){
        const mid=(lo+hi)/2,
        n=sampleAt(mid);
        if(mix(p.prevY,p.y,mid)+h>=n.y)hi=mid;
        else lo=mid;
      }
      const hit=sampleAt(hi);
      if(hit.x+w/2<b.left||hit.x-w/2>b.right)return null;

function updateCompression(s){
  const bounds=netBounds(s)
  for(const p of s.players){
    const bounce=p.compression
    if(!bounce)continue
    const net=sampleNetAt(s,p.x)
    if(p.x+CONFIG.player.width/2<bounds.left||p.x-CONFIG.player.width/2>bounds.right){
      p.compression=null
      p.vy=Math.max(0,net.vy)
      continue
    }
    p.y=net.y-CONFIG.player.height-CONFIG.collision.epsilon
    p.vy=net.vy
    bounce.remaining--
    if(bounce.remaining>0)continue
    p.vy=-bounce.launch
    p.compression=null
    p.bouncePressed=false
    p.lastBounceTick=s.rallyTicks
    if(bounce.perfect)p.lastPerfectTick=s.rallyTicks
    emit(s,'RELEASE',{id:p.id,x:p.x,y:net.y,perfect:bounce.perfect,tier:p.tier})
  }
}
function resolveNetLandings(s){
  const pending=[]
  for(const p of s.players){
    const hit=findNetLanding(s,p)
    if(!hit)continue
    const c=CONFIG.bounce
    const perfect=s.rallyTicks-p.netPressTick<=c.perfectWindowTicks&&p.netPressTick<=s.rallyTicks
    p.tier=clamp(p.tier+(perfect?1:-1),c.minTier,c.maxTier)
    const wave=clamp(-hit.vy,-c.netWaveGainMax,c.netWaveGainMax)
    const speed=p.vy
    const strong=perfect||p.diving||speed>=c.strongImpactSpeed
    const duration=strong?c.strongCompressionTicks:c.compressionTicks
    const impact=CONFIG.trampoline.impactStrength*clamp(speed/CONFIG.trampoline.impactSpeedReference,CONFIG.trampoline.impactScaleMin,CONFIG.trampoline.impactScaleMax)*(p.diving?CONFIG.trampoline.diveImpactMultiplier:1)*(perfect?c.perfectImpactMultiplier:1)
    p.x=hit.x
    p.y=hit.y-CONFIG.player.height-CONFIG.collision.epsilon
    p.vy=0
    p.compression={remaining:duration,duration,launch:c.baseImpulse+p.tier*c.impulsePerTier+wave,perfect}
    p.netPressTick=NEVER
    p.savePressTick=NEVER
    p.lastLandingTick=s.rallyTicks
    s.stats.bounces[p.id]++
    if(perfect)s.stats.perfect[p.id]++
    pending.push({x:clamp(hit.x,netBounds(s).left,netBounds(s).right),strength:impact})
    emit(s,perfect?'PERFECT':'BOUNCE',{id:p.id,x:p.x,y:hit.y,tier:p.tier,wave})
  }
  for(const impact of pending)impactNet(s,impact.x,impact.strength)
  return pending.length
}

function resolveRallyOutcome(s){
  if(s.phase!=='RALLY')return false;
  const out=s.players.map(p=>p.y>CONFIG.canvas.height);
  if(!out.some(Boolean))return false;
  const winner=out[0]===out[1]?null:(out[0]?1:0);
  s.pendingPoint=winner;
  if(winner===null)s.stats.draws++;
  else{
    s.scores[winner]++;
    s.stats.points++;
  }
  clearPlayerPresses(s);
  emit(s,winner===null?'DRAW':'POINT',{
    id:winner,
    x:CONFIG.canvas.width/2,
    y:200
  });
  if(winner!==null&&s.scores[winner]>=CONFIG.scoring.pointsToWin){
    s.winner=winner;
    s.phase='MATCH_OVER';
    emit(s,'VICTORY',{
      id:winner
    });
  }else{
    s.phase='POINT_FREEZE';
    s.pointTicks=Math.round(CONFIG.scoring.pointPresentationSeconds*CONFIG.simulation.hz);

}
// Sole physics coordinator: forces, mesh, bodies, bumpers, landings, simultaneous KO.
function stepSimulation(s,input={
  held:{
  },
  pressed:[]
}){
  if(!['RALLY','POINT_FREEZE'].includes(s.phase))return false;
  s.events=[];
  s.totalTicks++;
  s.effects=s.effects.filter(e=>s.totalTicks-e.tick<CONFIG.presentation.eventTicks);
  if(s.phase==='POINT_FREEZE'){
    s.pointTicks--;
    if(s.pointTicks<=0)resetRally(s);
    return true;
  }
  s.rallyTicks++;
  acceptPresses(s,new Set(input.pressed||[]));
  const o=CONFIG.overdrive;
  if(o.enabled){
    const start=Math.round(o.beginSeconds*CONFIG.simulation.hz),
    warning=Math.round(o.warningSeconds*CONFIG.simulation.hz);
    if(s.rallyTicks===start-warning)emit(s,'WARNING');
    if(s.rallyTicks===start)emit(s,'OVERDRIVE');
    s.overdriveInset=clamp((s.rallyTicks-start)/(o.shrinkSeconds*CONFIG.simulation.hz),0,1)*o.maxInsetEachSide;
  }
  for(const p of s.players){
    const wasDiving=p.diving;
    steerAndMove(p,input.held||{
    });
    if(p.diving&&!wasDiving&&s.rallyTicks>=p.diveSoundReady){
      emit(s,'DIVE',{
        id:p.id,
        x:p.x,
        y:p.y
      });
      p.diveSoundReady=s.rallyTicks+CONFIG.audio.dive.cooldownTicks;
    }
  }
  stepNet(s);
  updateCompression(s);
  resolvePlayerContact(s);
  for(const p of s.players)resolveBumperSave(s,p);
  resolveNetLandings(s);
  resolveRallyOutcome(s);
  for(const p of s.players){
    if(s.rallyTicks-p.netPressTick>CONFIG.bounce.perfectWindowTicks)p.netPressTick=NEVER;
    if(s.rallyTicks-p.savePressTick>CONFIG.bumper.preContactTicks)p.savePressTick=NEVER;
  }
  return true;
}
// Physical key codes, independent held state, and one fresh edge per release/press.
function createInput(){
  const held=Object.create(null),
  edges=new Set();
  return {
    held,
    keydown(e){
      if(!GAME_KEYS.has(e.code))return false;
      if(e.preventDefault)e.preventDefault();
      if(e.repeat||held[e.code])return false;
      held[e.code]=true;
      edges.add(e.code);
      return true;
    },
    keyup(e){
      if(GAME_KEYS.has(e.code)&&e.preventDefault)e.preventDefault();
      delete held[e.code];
    },
    take(){
      const pressed=Array.from(edges);
      edges.clear();
      return {
        held:Object.assign({
        },held),
        pressed
      };
    },
    clear(){
      for(const k of Object.keys(held))delete held[k];
      edges.clear();
    }
  };
}
// Rendering cadence never controls physics. Reset invalidates in-flight catch-up.
function createFrameDriver(update,render=()=>{
}){
  let last=null,
  acc=0,
  generation=0;
  const stepMs=1000/CONFIG.simulation.hz;
  return {
    reset(){
      last=null;
      acc=0;
      generation++;
    },
    frame(timestamp,running=true){
      if(last===null)last=timestamp;
      const elapsed=clamp(timestamp-last,0,CONFIG.simulation.maxFrameMs);
      last=timestamp;
      if(!running){
        acc=0;
        render(0);
        return 0;
      }
      acc+=elapsed;
      let count=0;
      const activeGeneration=generation;
      while(acc+1e-7>=stepMs&&count<CONFIG.simulation.maxSteps){
        update();
        count++;
        if(generation!==activeGeneration){
          render(0);
          return count;
        }
        acc=Math.max(0,acc-stepMs);
      }
      if(count===CONFIG.simulation.maxSteps&&acc>=stepMs)acc%=stepMs;
      render(acc/stepMs);
      return count;
    }
  };
}
function landingSoon(s,p){
  if(p.vy<0)return false;
  const b=netBounds(s);
  if(p.x<b.left||p.x>b.right)return false;
  const distance=sampleNetAt(s,p.x).y-p.y-CONFIG.player.height,
  g=CONFIG.player.gravity+(p.diving?CONFIG.player.diveGravityBonus:0),
  t=(-p.vy+Math.sqrt(Math.max(0,p.vy*p.vy+2*g*Math.max(0,distance))))/g;
  return distance>=0&&t<=CONFIG.bounce.perfectWindowTicks;
}

function bumperReady(s, p, side) {
  if (!p.recoveryCharge) return false
  const B = CONFIG.bumper
  if (p.contact?.side === side && s.rallyTicks - p.contact.tick <= B.postContactGraceTicks) return true
  const direction = side === 0 ? -1 : 1
  const speed = p.vx * direction
  if (speed <= CONFIG.collision.epsilon) return false
  const x = side === 0 ? B.leftX : B.rightX
  const distance = (x - p.x - direction * CONFIG.player.width / 2) * direction
  const ticks = distance / speed
  if (distance < 0 || distance > B.promptDistance || ticks > B.preContactTicks) return false
  const gravity = CONFIG.player.gravity + (p.diving ? CONFIG.player.diveGravityBonus : 0)
  const y = p.y + p.vy * ticks + gravity * ticks * (ticks + 1) / 2
  return y + CONFIG.player.height >= B.topY && y <= B.bottomY
}
function drawBumpers(ctx, s) {
  const B = CONFIG.bumper
  const A = ART.bumper
  const C = CONFIG.colors
  for (const side of [0, 1]) {
    const x = side === 0 ? B.leftX : B.rightX
    const direction = side === 0 ? 1 : -1
    const ready = s.players.filter(p => bumperReady(s, p, side))
    const color = ready.length === 1 ? playerColor(ready[0].id) : ready.length ? C.gold : ART.colors.dim
    const impact = s.effects.findLast(e => (e.type === 'BUMPER' || e.type === 'SNAPBACK') && Math.abs(e.x - x) < CONFIG.player.width)
    const age = impact ? s.totalTicks - impact.tick : A.bendTicks
    const bend = !s.reducedMotion && age < A.bendTicks ? Math.sin(Math.PI * age / A.bendTicks) * A.bend : 0
    const cy = impact ? clamp(impact.y, B.topY + A.cueLength, B.bottomY - A.cueLength) : (B.topY + B.bottomY) / 2
    for (const y of [B.topY, B.bottomY]) {
      ctx.fillStyle = ART.colors.marking
      ctx.fillRect(x - A.anchorWidth / 2, y - A.anchorHeight / 2, A.anchorWidth, A.anchorHeight)
      line(ctx, [[x - A.anchorWidth / 2, y], [x + A.anchorWidth / 2, y]], ART.colors.dim, 2)

    ctx.strokeStyle = ART.colors.marking

    ctx.stroke()

    for (const i of Array.from({ length: Math.floor((B.bottomY - B.topY) / ART.net.stitchStep) }).keys()) {

      const u = (y - B.topY) / (B.bottomY - B.topY)

      ctx.strokeStyle = color
      ctx.lineWidth = 2 * (1 - t) + .5
      ctx.beginPath()
      ctx.ellipse(e.x, e.y - 2, 8 + A.ringRadius * t, 2 + A.ringHeight * t, 0, Math.PI, Math.PI * 2)
      ctx.stroke()
    } else if (e.type === 'STOMP') {
      const r = A.impactRadius * (.3 + .7 * t)
      for (const direction of [-1, 1]) {
        line(ctx, [[e.x + direction * r * .5, e.y - r * .4], [e.x + direction * r, e.y - r * .7]], CONFIG.colors.ivory, 2.2)
        line(ctx, [[e.x + direction * r * .6, e.y + r * .25], [e.x + direction * r, e.y + r * .5]], color, 2)
      }
    } else if (e.type === 'SNAPBACK') {
      ctx.strokeStyle = color
      ctx.lineWidth = 2
      ctx.beginPath()
      const x = e.x - e.direction * (4 + t * 5)
      ctx.ellipse(x, e.y + CONFIG.player.height / 2, 4 + t * 9, 9 + t * 15, 0, -Math.PI / 2, Math.PI / 2, e.direction < 0)
      ctx.stroke()
    }
    ctx.restore()
  }
}
function shake(s) {
  if (s.reducedMotion || s.phase !== 'RALLY') return [0, 0]
  let amount = 0
  for (const e of s.effects) {
    const age = s.totalTicks - e.tick
    if (age < 0 || age >= CONFIG.presentation.shakeTicks) continue
    const strength = e.type === 'STOMP' ? CONFIG.presentation.stompShakePx : e.type === 'SNAPBACK' ? CONFIG.presentation.saveShakePx : 0
    amount = Math.max(amount, strength * (1 - age / CONFIG.presentation.shakeTicks))
  }
  return [Math.sin(s.totalTicks * ART.effect.shakeX) * amount, Math.cos(s.totalTicks * ART.effect.shakeY) * amount * .45]
}
function wordmark(ctx) {
  const T = ART.title
  const glyphs = {
    S: [[[8, 0], [47, 0], [47, 14], [16, 14], [16, 27], [40, 27], [48, 35], [48, 62], [40, 70], [0, 70], [0, 56], [32, 56], [32, 42], [8, 42], [0, 34], [0, 8]]],
    N: [[[0, 70], [0, 0], [15, 0], [32, 38], [32, 0], [48, 0], [48, 70], [33, 70], [16, 32], [16, 70]]],
    A: [[[0, 70], [10, 0], [38, 0], [48, 70], [32, 70], [30, 49], [18, 49], [16, 70]], [[20, 35], [28, 35], [25, 14], [23, 14]]],
    P: [[[0, 70], [0, 0], [40, 0], [48, 8], [48, 37], [40, 45], [16, 45], [16, 70]], [[16, 14], [16, 31], [32, 31], [32, 14]]],
    B: [[[0, 70], [0, 0], [39, 0], [47, 8], [47, 27], [40, 35], [48, 42], [48, 62], [40, 70]], [[16, 14], [16, 28], [31, 28], [31, 14]], [[16, 42], [16, 56], [32, 56], [32, 42]]],
    C: [[[8, 0], [48, 0], [48, 15], [16, 15], [16, 55], [48, 55], [48, 70], [8, 70], [0, 62], [0, 8]]],
    K: [[[0, 70], [0, 0], [16, 0], [16, 28], [32, 0], [50, 0], [30, 35], [50, 70], [32, 70], [16, 42], [16, 70]]]
  }
  const word = 'SNAPBACK'
  ctx.save()
  ctx.translate(ART.centerX, T.wordY)
  ctx.scale(T.wordScale, T.wordScale)
  ctx.transform(1, 0, -.07, 1, 0, 0)
  ctx.translate(-(word.length * (T.letterWidth + T.letterGap) - T.letterGap) / 2, 0)
  ctx.fillStyle = CONFIG.colors.ivory
  Array.from(word).forEach((letter, i) => {
    ctx.save()
    ctx.translate(i * (T.letterWidth + T.letterGap), 0)
    ctx.beginPath()
    for (const contour of glyphs[letter]) {
      contour.forEach((p, j) => j ? ctx.lineTo(...p) : ctx.moveTo(...p))
      ctx.closePath()
    }
    ctx.fill('evenodd')
    ctx.restore()
  })
  ctx.restore()
}
function drawTitle(ctx, s, time) {
  const T = ART.title
  wordmark(ctx)
  const phase = s.reducedMotion ? .7 : time * T.hopSpeed
  const points = []
  for (const i of Array.from({ length: CONFIG.trampoline.samples + 1 }).keys()) {
    const u = i / CONFIG.trampoline.samples
    const wave = s.reducedMotion ? 0 : Math.sin(phase * 2 - u * 8) * 2
    points.push([mix(T.netLeft, T.netRight, u), T.netY + Math.sin(Math.PI * u) * (3 + wave)])
  }
  line(ctx, points.map(p => [p[0], p[1] + ART.net.meshDepth]), ART.colors.mesh)
  line(ctx, points, CONFIG.colors.gold, ART.net.cordWidth)
  for (const [x, direction] of [[T.netLeft, 1], [T.netRight, -1]]) {
    line(ctx, [[x, T.netY], [x - direction * 7, T.netY + 24], [x + direction * 9, T.netY + 24]], CONFIG.colors.gold, 3)
  }
  for (const p of s.players) {
    const offset = phase + p.id * 1.5
    const hop = Math.abs(Math.sin(offset)) * T.hopHeight
    const pose = { ...p, vx: Math.cos(offset) * 1.4, vy: -Math.cos(offset) * 8, diving: false, protection: 0 }
    drawPlayer(ctx, pose, s, { x: T.playerX[p.id] + Math.sin(offset) * 12, footY: T.netY - hop, scale: T.playerScale })
  }
  drawText(ctx, 'Space to play', ART.centerX, T.promptY, T.promptSize, CONFIG.colors.ivory, 500)
}
function drawPause(ctx, s) {
  const A = ART.pause
  drawScore(ctx, s)
  drawText(ctx, 'Paused', ART.centerX, A.titleY, A.titleSize, CONFIG.colors.ivory, 800)
  drawText(ctx, 'Esc to resume', ART.centerX, A.promptY, 16, ART.colors.dim, 500)
  drawText(ctx, 'A / D   move     W   bounce     S   dive', ART.centerX, A.controlsY, 15, CONFIG.colors.coral, 500)
  drawText(ctx, '← / →   move     ↑   bounce     ↓   dive', ART.centerX, A.controlsY + 31, 15, CONFIG.colors.mint, 500)
}
function drawWinner(ctx, s, time) {
  const W = ART.winner
  const p = s.players[s.winner ?? 0]
  const hop = s.reducedMotion ? 0 : Math.abs(Math.sin(time * W.hopSpeed)) * W.hopHeight
  const pose = { ...p, vx: 0, vy: 0, protection: 0, diving: false, compression: null }
  drawPlayer(ctx, pose, s, { x: ART.centerX, footY: W.footY - hop, scale: W.scale, facing: 1, winning: true })
  drawScore(ctx, s, W.scoreY, W.scoreSize)
  drawText(ctx, 'Space to rematch', ART.centerX, W.promptY, ART.title.promptSize, CONFIG.colors.ivory, 500)
}
function drawGame(ctx, s, time, alpha = 1) {
  ctx.save()
  ctx.lineJoin = 'round'
  ctx.lineCap = 'round'
  backdrop(ctx)
  if (s.phase === 'TITLE') drawTitle(ctx, s, time)
  else if (s.phase === 'PAUSED') drawPause(ctx, s)
  else if (s.phase === 'MATCH_OVER') drawWinner(ctx, s, time)
  else {
    ctx.save()
    ctx.translate(...shake(s))
    const blend = s.phase === 'RALLY' ? clamp(alpha, 0, 1) : 1
    const view = { ...s,
      players: s.players.map(p => ({ ...p, x: mix(p.prevX, p.x, blend), y: mix(p.prevY, p.y, blend) })),
      net: { ...s.net, d: s.net.d.map((d, i) => mix(s.net.previous[i], d, blend)) }
    }
    drawArena(ctx, view)
    for (const p of view.players) {
      drawTrails(ctx, view, p)
      const winning = s.phase === 'POINT_FREEZE' && p.id === s.pendingPoint
      drawPlayer(ctx, p, view, { winning })
    }
    drawEffects(ctx, s)
    ctx.restore()
    drawScore(ctx, s)
  }
  ctx.restore()
}

// Short local synthesis. Failures and blocked audio never affect simulation.
function createAudio(){
  let context=null,
  master=null,
  muted=false,
  paused=false;
  const voices=new Set();
  const bounceCount=[0,0];
  function stop(){
    for(const voice of Array.from(voices)){
      try{
        voice.oscillator.stop();
      }catch(_){
      }
      voice.release();
    }
    voices.clear();
  }
  function updateGain(){
    if(master)master.gain.value=muted||paused?0:CONFIG.audio.masterGain;
  }
  function setMuted(value){
    muted=value;
    updateGain();
    if(muted)stop();
  }
  function unlock(){
    try{
      if(!context){
        const AudioCtor=globalThis.AudioContext||globalThis.webkitAudioContext;
        if(!AudioCtor)return;
        context=new AudioCtor();
        master=context.createGain();
        updateGain();
        master.connect(context.destination);
      }
      if(context.state==='suspended')context.resume().catch(()=>{
      });
    }catch(_){
      context=null;
      master=null;
    }
  }
  function note(frequency,duration,type,offset=0,endFrequency=frequency,volume=1){
    const c=CONFIG.audio;
    if(!context||context.state!=='running'||muted||paused||voices.size>=c.maxVoices)return;
    let oscillator=null,
    gain=null,
    voice=null;
    try{
      oscillator=context.createOscillator();
      gain=context.createGain();
      const start=context.currentTime+offset;
      voice={
        oscillator,
        gain,
        release(){
          voices.delete(voice);
          oscillator.onended=null;
          try{
            oscillator.disconnect();
          }catch(_){
          }
          try{
            gain.disconnect();
          }catch(_){
          }
        }
      };
      oscillator.type=type;
      oscillator.frequency.setValueAtTime(frequency,start);
      oscillator.frequency.exponentialRampToValueAtTime(Math.max(1,endFrequency),start+duration);
      gain.gain.setValueAtTime(c.floorGain,start);
      gain.gain.exponentialRampToValueAtTime(c.peakGain*volume,start+c.attackSeconds);
      gain.gain.exponentialRampToValueAtTime(c.floorGain,start+duration);
      oscillator.connect(gain);
      gain.connect(master);
      voices.add(voice);
      oscillator.onended=voice.release;
      oscillator.start(start);
      oscillator.stop(start+duration+c.releasePadding);
    }catch(_){
      if(voice)voice.release();
      else{
        if(oscillator)try{
          oscillator.disconnect();
        }catch(_){
        }
        if(gain)try{
          gain.disconnect();
        }catch(_){
        }
      }
    }
  }
  function phrase(cue){
    cue.notes.forEach((frequency,i)=>note(frequency,cue.seconds,cue.wave,(cue.spacing||0)*i,cue.ends?cue.ends[i]:frequency,cue.volume??1));
  }
  function event(e){
    const a=CONFIG.audio;
    if(e.type==='BOUNCE'){
      const cue=a.bounce
      const id=e.id??0
      const pitch=cue.variations[bounceCount[id]++%cue.variations.length]
      note((cue.baseHz+e.tier*cue.tierHz)*pitch,cue.seconds,cue.wave,0,cue.endHz*pitch,cue.volume)
    }
    const cue={
      PERFECT:a.perfect,
      STOMP:a.stomp,
      SNAPBACK:a.save,
      POINT:a.point,
      VICTORY:a.victory,
      OVERDRIVE:a.overdrive,
      DIVE:a.dive
    }
    [e.type];
    if(cue)phrase(cue);
  }
  return {
    unlock,
    event,
    setMuted,
    setPaused(value){
      paused=value;
      if(paused)stop();
      updateGain();
    },
    inspect(){
      return {
        initialized:!!context,
        state:context?context.state:'unavailable',
        voices:voices.size,
        muted,
        paused
      };
    }
  };
}
// Browser adapter: input/settings/audio/rendering stay outside gameplay functions.
function boot(){
  const canvas=document.getElementById('game');
  const ctx=canvas.getContext('2d');
  const s=createMatchState(),
  input=createInput(),
  audio=createAudio();
  const status=document.getElementById('status');
  let lastPhase=s.phase;
  function announce(){
    if(lastPhase===s.phase)return;
    lastPhase=s.phase;
    syncSettings();
    const name=s.winner===0?'Coral':'Mint';
    status.textContent=s.phase==='MATCH_OVER'?name+' wins. Space or Enter to rematch.':s.phase==='PAUSED'?'Paused. Escape to resume.':s.phase==='RALLY'?'Match in play. First to three.':s.phase==='POINT_FREEZE'?'Point. Next rally starts automatically.':'Snapback. Space to play.';
  }
  function resetInputs(){
    input.clear();
    clearPlayerPresses(s);
    driver.reset();
  }
  function syncSettings(){
    const sound=document.getElementById('sound'),
    motion=document.getElementById('motion');
    document.getElementById('controls').hidden=s.phase!=='PAUSED';
    sound.textContent='M · Sound '+(s.muted?'off':'on');
    sound.setAttribute('aria-pressed',String(s.muted));
    motion.textContent='V · Motion '+(s.reducedMotion?'reduced':'full');
    motion.setAttribute('aria-pressed',String(s.reducedMotion));
    audio.setMuted(s.muted);
  }
  function pause(value){
    setPaused(s,value);
    resetInputs();
    audio.setPaused(value||s.phase==='PAUSED');
    if(s.phase!=='PAUSED')canvas.focus({preventScroll:true});
    announce();
  }
  function command(code,gesture=false){
    if(gesture)audio.unlock();
    if(code==='KeyM'){
      s.muted=!s.muted;
      syncSettings();
      return;
    }
    if(code==='KeyV'){
      s.reducedMotion=!s.reducedMotion;
      syncSettings();
      return;
    }
    if(code==='Escape'&&['RALLY','POINT_FREEZE','PAUSED'].includes(s.phase)){
      pause(s.phase!=='PAUSED');
      return;
    }
    if(['Space','Enter','KeyW','ArrowUp'].includes(code)&&['TITLE','MATCH_OVER'].includes(s.phase)){
      startMatch(s);
      resetInputs();
      audio.setPaused(false);
      canvas.focus({
        preventScroll:true
      });
      announce();
    }
  }
  function update(){
    const priorIndex=s.rallyIndex;
    const advanced=stepSimulation(s,input.take());
    if(advanced)for(const e of s.events)audio.event(e);
    if(s.rallyIndex!==priorIndex)resetInputs();
    announce();
  }
  const driver=createFrameDriver(update,alpha=>drawGame(ctx,s,performance.now()/1000,alpha));
  function resize(){
    const scale=Math.min(window.innerWidth/CONFIG.canvas.width,window.innerHeight/CONFIG.canvas.height);
    const dpr=Math.min(window.devicePixelRatio||1,CONFIG.canvas.maxDpr);
    canvas.style.width=CONFIG.canvas.width*scale+'px';
    canvas.style.height=CONFIG.canvas.height*scale+'px';
    canvas.width=Math.round(CONFIG.canvas.width*dpr);
    canvas.height=Math.round(CONFIG.canvas.height*dpr);
    document.getElementById('controls').style.transform='translateX(-50%) scale('+Math.min(scale,1)+')';
    document.getElementById('controls').style.transformOrigin='top center';
    document.getElementById('controls').style.top=((window.innerHeight-CONFIG.canvas.height*scale)/2+CONFIG.art.pause.settingsY*scale)+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    drawGame(ctx,s,0);
  }
  window.addEventListener('keydown',e=>{
    if(e.target instanceof HTMLButtonElement&&(e.code==='Space'||e.code==='Enter'))return; if(input.keydown(e))command(e.code,e.isTrusted);
  });
  window.addEventListener('keyup',e=>{if(e.target instanceof HTMLButtonElement&&(e.code==='Space'||e.code==='Enter'))return;input.keyup(e);});
  window.addEventListener('blur',()=>pause(true));
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden)pause(true);
  });
  window.addEventListener('resize',resize);
  document.getElementById('sound').addEventListener('click',e=>command('KeyM',e.isTrusted));
  document.getElementById('motion').addEventListener('click',e=>command('KeyV',e.isTrusted));
  canvas.addEventListener('pointerdown',e=>{
    if(e.isTrusted)audio.unlock();canvas.focus({
      preventScroll:true
    });if(['TITLE','MATCH_OVER'].includes(s.phase))command('Space',e.isTrusted);
  });
  function frame(time){
    driver.frame(time,['RALLY','POINT_FREEZE'].includes(s.phase));
    requestAnimationFrame(frame);
  }
  syncSettings();
  resize();
  requestAnimationFrame(frame);
  canvas.dataset.ready='true';
  if(testMode)Object.assign(globalThis.SnapbackTest,{
    getState:()=>s,
    input,
    audio,
    driver,
    pause,
    command,
    render:()=>drawGame(ctx,s,0)
  });
}
const testMode=!!globalThis.__SNAPBACK_TEST__||(typeof location!=='undefined'&&new URLSearchParams(location.search).has('test'));
if(testMode)globalThis.SnapbackTest={
  CONFIG,
  NEVER,
  PLAYER_KEYS,
  createPlayer,
  createNet,
  createMatchState,
  resetRally,
  startMatch,
  setPaused,
  clearPlayerPresses,
  netBounds,
  sampleNetAt,
  stepNet,
  impactNet,
  acceptPresses,
  steerAndMove,
  bodyContact,
  resolvePlayerContact,
  resolveBumperSave,
  resolveNetLandings,
  updateCompression,
  findNetLanding,
  resolveRallyOutcome,
  stepSimulation,
  createInput,
  createFrameDriver,
  landingSoon,
  createAudio,
  drawGame
};
if(typeof document!=='undefined')boot();
</script></body></html>
